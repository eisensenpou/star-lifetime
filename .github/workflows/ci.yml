name: CI

# Trigger on push and pull request events
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Cancel in-progress workflows for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux builds
  build-linux:
    name: Linux (Ubuntu ${{ matrix.version }})
    runs-on: ubuntu-${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: [20.04, 22.04]
        compiler: [gcc-9, gcc-11, clang-12, clang-14]
        exclude:
          # Exclude incompatible combinations
          - version: 20.04
            compiler: gcc-11
          - version: 20.04
            compiler: clang-14
          - version: 22.04
            compiler: gcc-9
          - version: 22.04
            compiler: clang-12

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential

    - name: Install specific compiler
      run: |
        case "${{ matrix.compiler }}" in
          gcc-9)
            sudo apt-get install -y g++-9
            echo "CC=gcc-9" >> $GITHUB_ENV
            echo "CXX=g++-9" >> $GITHUB_ENV
            ;;
          gcc-11)
            sudo apt-get install -y g++-11
            echo "CC=gcc-11" >> $GITHUB_ENV
            echo "CXX=g++-11" >> $GITHUB_ENV
            ;;
          clang-12)
            sudo apt-get install -y clang-12
            echo "CC=clang-12" >> $GITHUB_ENV
            echo "CXX=clang++-12" >> $GITHUB_ENV
            ;;
          clang-14)
            sudo apt-get install -y clang-14
            echo "CC=clang-14" >> $GITHUB_ENV
            echo "CXX=clang++-14" >> $GITHUB_ENV
            ;;
        esac

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17

    - name: Build
      run: |
        cd build
        make -j$(nproc)

    - name: Test
      run: |
        cd build
        ctest --output-on-failure

    - name: Run basic functionality test
      run: |
        cd build
        echo "2.0" | ./bin/star_lifetime > /dev/null
        if [ $? -eq 0 ]; then
          echo "✅ Basic functionality test passed"
        else
          echo "❌ Basic functionality test failed"
          exit 1
        fi

  # macOS builds
  build-macos:
    name: macOS (${{ matrix.version }})
    runs-on: macos-${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: [11, 12, 13]
        compiler: [clang, gcc-12]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        if [ "${{ matrix.compiler }}" = "gcc-12" ]; then
          brew install gcc@12
          echo "CC=gcc-12" >> $GITHUB_ENV
          echo "CXX=g++-12" >> $GITHUB_ENV
        else
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
        fi

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17

    - name: Build
      run: |
        cd build
        make -j$(sysctl -n hw.ncpu)

    - name: Test
      run: |
        cd build
        ctest --output-on-failure

    - name: Run basic functionality test
      run: |
        cd build
        echo "2.0" | ./bin/star_lifetime > /dev/null
        if [ $? -eq 0 ]; then
          echo "✅ Basic functionality test passed"
        else
          echo "❌ Basic functionality test failed"
          exit 1
        fi

  # Windows builds
  build-windows:
    name: Windows (${{ matrix.compiler }})
    runs-on: windows-${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: [2019, 2022]
        compiler: [MSVC, clang]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC Developer Environment
      if: matrix.compiler == 'MSVC'
      uses: microsoft/setup-msbuild@v1.3

    - name: Setup Clang
      if: matrix.compiler == 'clang'
      uses: egor-tensin/setup-clang@v1
      with:
        version: latest
        platform: x64

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        if ("${{ matrix.compiler }}" -eq "clang") {
          cmake .. -G "Visual Studio 16 2019" -DCMAKE_CXX_STANDARD=17 -T "ClangCL"
        } else {
          cmake .. -G "Visual Studio 16 2019" -DCMAKE_CXX_STANDARD=17
        }

    - name: Build
      run: |
        cd build
        cmake --build . --config Release --parallel

    - name: Test
      run: |
        cd build
        ctest --output-on-failure -C Release

    - name: Run basic functionality test
      run: |
        cd build
        echo "2.0" | ./bin/Release/star_lifetime.exe > $null
        if ($LASTEXITCODE -eq 0) {
          Write-Host "✅ Basic functionality test passed"
        } else {
          Write-Host "❌ Basic functionality test failed"
          exit 1
        }

  # Code quality and formatting checks
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential clang-format-14 cppcheck

    - name: Check code formatting
      run: |
        find src include -name "*.cpp" -o -name "*.h" | xargs clang-format-14 --dry-run --Werror
        echo "✅ Code formatting check passed"

    - name: Static analysis with cppcheck
      run: |
        cppcheck --enable=all --inconclusive --std=c++17 src/ include/ --error-exitcode=1
        echo "✅ Static analysis check passed"

    - name: Check for common issues
      run: |
        # Check for TODO/FIXME comments
        if grep -r "TODO\|FIXME" src/ include/; then
          echo "⚠️ Found TODO/FIXME comments"
        fi
        
        # Check for very long lines
        if grep -r ".\{120\}" src/ include/; then
          echo "⚠️ Found lines longer than 120 characters"
        fi

  # Documentation build check
  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y markdown

    - name: Check README syntax
      run: |
        markdown README.md > /dev/null
        echo "✅ README.md syntax is valid"

    - name: Check documentation structure
      run: |
        # Check if key documentation files exist
        if [ ! -f "docs/README.md" ]; then
          echo "❌ docs/README.md not found"
          exit 1
        fi
        
        if [ ! -f "docs/examples/basic_usage.md" ]; then
          echo "❌ docs/examples/basic_usage.md not found"
          exit 1
        fi
        
        if [ ! -f "docs/api_reference/physics_api.md" ]; then
          echo "❌ docs/api_reference/physics_api.md not found"
          exit 1
        fi
        
        echo "✅ Documentation structure is valid"

  # Performance benchmark
  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential time

    - name: Build
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        make -j$(nproc)

    - name: Run benchmarks
      run: |
        cd build
        
        # Benchmark build time
        echo "📊 Build performance:"
        time make clean && make -j$(nproc)
        
        # Benchmark runtime performance
        echo "📊 Runtime performance:"
        time echo "1.0" | ./bin/star_lifetime > /dev/null
        
        # Generate lifetime table performance
        echo "📊 Table generation performance:"
        time echo "2" | ./bin/star_lifetime > /dev/null

  # Security scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # Build status summary
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows, code-quality, docs-check]
    if: always()

    steps:
    - name: Build Summary
      run: |
        echo "## 🚀 Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Linux results
        if [ "${{ needs.build-linux.result }}" == "success" ]; then
          echo "✅ Linux: All builds passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Linux: Some builds failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        # macOS results
        if [ "${{ needs.build-macos.result }}" == "success" ]; then
          echo "✅ macOS: All builds passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ macOS: Some builds failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Windows results
        if [ "${{ needs.build-windows.result }}" == "success" ]; then
          echo "✅ Windows: All builds passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Windows: Some builds failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Code quality results
        if [ "${{ needs.code-quality.result }}" == "success" ]; then
          echo "✅ Code Quality: All checks passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Code Quality: Some checks failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Documentation results
        if [ "${{ needs.docs-check.result }}" == "success" ]; then
          echo "✅ Documentation: All checks passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Documentation: Some checks failed" >> $GITHUB_STEP_SUMMARY
        fi