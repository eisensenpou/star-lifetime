name: CI

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # =========================
  # Linux builds
  # =========================
  build-linux:
    name: Linux (Ubuntu ${{ matrix.version }} - ${{ matrix.compiler }})
    runs-on: ubuntu-${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: [20.04, 22.04]
        compiler: [gcc-9, gcc-11, clang-12, clang-14]
        exclude:
          - version: 20.04
            compiler: gcc-11
          - version: 20.04
            compiler: clang-14
          - version: 22.04
            compiler: gcc-9
          - version: 22.04
            compiler: clang-12

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential

    - name: Install specific compiler
      run: |
        case "${{ matrix.compiler }}" in
          gcc-9)
            sudo apt-get install -y g++-9
            echo "CC=gcc-9" >> $GITHUB_ENV
            echo "CXX=g++-9" >> $GITHUB_ENV
            ;;
          gcc-11)
            sudo apt-get install -y g++-11
            echo "CC=gcc-11" >> $GITHUB_ENV
            echo "CXX=g++-11" >> $GITHUB_ENV
            ;;
          clang-12)
            sudo apt-get install -y clang-12
            echo "CC=clang-12" >> $GITHUB_ENV
            echo "CXX=clang++-12" >> $GITHUB_ENV
            ;;
          clang-14)
            sudo apt-get install -y clang-14
            echo "CC=clang-14" >> $GITHUB_ENV
            echo "CXX=clang++-14" >> $GITHUB_ENV
            ;;
        esac

    - name: Configure
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17

    - name: Build
      run: |
        cd build
        make -j$(nproc)

    - name: Test
      run: |
        cd build
        ctest --output-on-failure

  # =========================
  # macOS builds
  # =========================
  build-macos:
    name: macOS (${{ matrix.version }} - ${{ matrix.compiler }})
    runs-on: macos-${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: [11, 12, 13]
        compiler: [clang, gcc-12]

    steps:
    - uses: actions/checkout@v4

    - name: Install compiler
      run: |
        if [ "${{ matrix.compiler }}" = "gcc-12" ]; then
          brew install gcc@12
          echo "CC=gcc-12" >> $GITHUB_ENV
          echo "CXX=g++-12" >> $GITHUB_ENV
        else
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
        fi

    - name: Configure
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17

    - name: Build
      run: |
        cd build
        make -j$(sysctl -n hw.ncpu)

    - name: Test
      run: |
        cd build
        ctest --output-on-failure

  # =========================
  # Windows builds
  # =========================
  build-windows:
    name: Windows (${{ matrix.compiler }})
    runs-on: windows-${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: [2022]
        compiler: [MSVC, clang]

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC
      if: matrix.compiler == 'MSVC'
      uses: microsoft/setup-msbuild@v1.3

    - name: Setup Clang
      if: matrix.compiler == 'clang'
      uses: egor-tensin/setup-clang@v1
      with:
        version: latest
        platform: x64

    - name: Configure
      shell: pwsh
      run: |
        mkdir build
        cd build
        if ("${{ matrix.compiler }}" -eq "clang") {
          cmake .. -G "Visual Studio 17 2022" -T "ClangCL" -DCMAKE_CXX_STANDARD=17
        } else {
          cmake .. -G "Visual Studio 17 2022" -DCMAKE_CXX_STANDARD=17
        }

    - name: Build
      run: |
        cd build
        cmake --build . --config Release --parallel

    - name: Test
      run: |
        cd build
        ctest --output-on-failure -C Release

  # =========================
  # Code quality
  # =========================
  code-quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format-14 cppcheck

    - name: Formatting check
      run: |
        find src include -name "*.cpp" -o -name "*.h" | xargs clang-format-14 --dry-run --Werror

    - name: Static analysis
      run: |
        cppcheck --enable=all --std=c++17 src/ include/ --error-exitcode=1

  # =========================
  # Docs check
  # =========================
  docs-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install markdown
      run: |
        sudo apt-get update
        sudo apt-get install -y markdown

    - name: Validate README
      run: |
        markdown README.md > /dev/null

  # =========================
  # Security scan
  # =========================
  security-scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # =========================
  # Summary
  # =========================
  build-summary:
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows, code-quality, docs-check]
    if: always()

    steps:
    - name: Summary
      run: |
        echo "## 🚀 CI Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Linux: ${{ needs.build-linux.result }}" >> $GITHUB_STEP_SUMMARY
        echo "macOS: ${{ needs.build-macos.result }}" >> $GITHUB_STEP_SUMMARY
        echo "Windows: ${{ needs.build-windows.result }}" >> $GITHUB_STEP_SUMMARY
        echo "Quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
        echo "Docs: ${{ needs.docs-check.result }}" >> $GITHUB_STEP_SUMMARY